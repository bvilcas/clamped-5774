<?xml version="1.0" encoding="UTF-8"?>
<!--
  Illustration: how a reported issue becomes a verified fix in Clamped, and why
  that takes two people.
  Original artwork created by Brent Vilcas for CS 5774 Project 2. Not sourced externally.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img">
  <title>An issue is reported, one teammate takes it and patches it, and a second teammate confirms the fix</title>

  <defs>
    <linearGradient id="cardFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
  </defs>

  <rect width="640" height="380" rx="20" fill="#f8fafc"/>

  <!-- Step 1: the issue as reported, with its severity dot and description -->
  <g>
    <rect x="30" y="34" width="250" height="96" rx="14" fill="url(#cardFade)" stroke="#e5e7eb" stroke-width="2"/>
    <circle cx="56" cy="60" r="7" fill="#7f1d1d"/>
    <rect x="72" y="53" width="120" height="8" rx="4" fill="#111827"/>
    <rect x="52" y="78" width="200" height="7" rx="3.5" fill="#d1d5db"/>
    <rect x="52" y="94" width="150" height="7" rx="3.5" fill="#d1d5db"/>
    <rect x="52" y="110" width="176" height="7" rx="3.5" fill="#d1d5db"/>
  </g>

  <!-- Step 2: one teammate holds the assignee role, so the status chip and a
       single avatar. One avatar here is the point: the fourth panel has two. -->
  <g>
    <rect x="360" y="34" width="250" height="96" rx="14" fill="url(#cardFade)" stroke="#e5e7eb" stroke-width="2"/>
    <rect x="382" y="52" width="94" height="22" rx="11" fill="#ffedd5"/>
    <rect x="394" y="60" width="70" height="7" rx="3.5" fill="#9a3412"/>
    <rect x="382" y="86" width="206" height="7" rx="3.5" fill="#d1d5db"/>
    <rect x="382" y="102" width="140" height="7" rx="3.5" fill="#d1d5db"/>
    <circle cx="572" cy="63" r="16" fill="#bfdbfe"/>
  </g>

  <!-- Step 3: patched. The key, the title, and its severity and status chips. -->
  <g>
    <rect x="30" y="176" width="250" height="96" rx="14" fill="url(#cardFade)" stroke="#e5e7eb" stroke-width="2"/>
    <text x="52" y="206" font-family="monospace" font-size="15" fill="#2563eb">CLM-142</text>
    <rect x="52" y="218" width="180" height="8" rx="4" fill="#111827"/>
    <rect x="52" y="240" width="62" height="20" rx="10" fill="#eff6ff"/>
    <rect x="124" y="240" width="62" height="20" rx="10" fill="#eff6ff"/>
  </g>

  <!-- Step 4: verified. Two avatars and a check: a different person closed it. -->
  <g>
    <rect x="360" y="176" width="250" height="96" rx="14" fill="url(#cardFade)" stroke="#e5e7eb" stroke-width="2"/>
    <circle cx="392" cy="216" r="16" fill="#bfdbfe"/>
    <circle cx="424" cy="216" r="16" fill="#dcfce7"/>
    <rect x="452" y="210" width="130" height="8" rx="4" fill="#111827"/>
    <rect x="392" y="246" width="120" height="7" rx="3.5" fill="#d1d5db"/>
    <path d="M556 238 l10 10 l20 -22" fill="none" stroke="#166534" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Flow arrows -->
  <g fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round">
    <path d="M292 82 H344" marker-end="url(#arrowHead)"/>
    <path d="M485 142 V164" marker-end="url(#arrowHead)"/>
    <path d="M348 224 H292" marker-end="url(#arrowHead)"/>
  </g>
  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Step captions -->
  <g font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">
    <text x="30" y="300">1. Somebody reports it</text>
    <text x="360" y="300">2. One teammate takes it</text>
    <text x="30" y="324">3. They patch it</text>
    <text x="360" y="324">4. A second one verifies</text>
  </g>
</svg>
